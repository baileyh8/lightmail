[package]
name = "lightmail-reader-performance-probe"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Isolated measurement tool. No change to the product workspace or its lockfile.
[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
anyrender = "=0.13.0"
anyrender_vello_cpu = "=0.17.0"
blitz-dom = { path = "../../.tooling/blitz-research/packages/blitz-dom", default-features = false, features = ["system-fonts"] }
blitz-html = { path = "../../.tooling/blitz-research/packages/blitz-html" }
blitz-paint = { path = "../../.tooling/blitz-research/packages/blitz-paint", default-features = false }
blitz-traits = { path = "../../.tooling/blitz-research/packages/blitz-traits" }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
