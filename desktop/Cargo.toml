[package]
name = "lightmail-desktop"
version = "0.0.4"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "Lightmail"
path = "src/main.rs"

[features]
acceptance = []

[dependencies]
lightmail_core = { path = ".." }
# All GPUI and component APIs come through the Kit facade, pinned as one set.
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "assets"] }
anyhow = "1"
base64 = "0.22"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
chrono = "0.4"
rfd = "0.15"
# Acceptance runs post input to the native window handle.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "assets", "test-support"] }
