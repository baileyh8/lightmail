[package]
name = "lightmail-desktop"
version = "0.0.4"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "Lightmail"
path = "src/main.rs"

[dependencies]
lightmail_core = { path = ".." }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest", "runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["webview"] }
wry = { package = "lb-wry", version = "0.53.3" }
anyhow = "1"
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
chrono = "0.4"
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
