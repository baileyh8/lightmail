[package]
name = "lightmail_core"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
path = "core/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "core/bindgen.rs"
required-features = ["bindings"]

[features]
bindings = ["uniffi/cli"]

[dependencies]
uniffi = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.16"
base64 = "0.22"
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
html2md = "0.2"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
ammonia = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.test]
debug = 0
